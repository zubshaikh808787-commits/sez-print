plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.td404printer'
version = '1.0.0'

android {
  namespace "expo.modules.td404printer"
  defaultConfig {
    versionCode 1
    versionName "1.0.0"
  }
}

dependencies {
  implementation 'androidx.core:core-ktx:1.13.1'
  // Ninestar / TD-404 LabelCommand + BitmapUtils (same AAR as vendor demo).
  implementation files('libs/labelprinter.aar')
}

// Classic Bluetooth SPP matches Ninestar TD-404 SppBluetoothPort transport.
// Print jobs use LabelCommand → fire-and-forget socket stream (no ACK wait).
